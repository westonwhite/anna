<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anna</title>
<meta name="theme-color" content="#0b0814">
<style>
:root{--bg:#07060d;--p:#110d1c;--p2:#181227;--line:#2b2045;--fg:#efeaf8;--mut:#9a8fb3;--acc:#b47cff;--acc2:#e9a8ff;--good:#3ddc97;--bad:#ff6b6b;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{background:radial-gradient(900px 400px at 85% -10%,rgba(180,124,255,.16),transparent 60%),var(--bg)}
button{font-family:inherit}
svg.i{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;flex-direction:column;gap:8px;padding:8px;height:100vh}
#nbar{flex:none;display:flex;align-items:stretch;height:36px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--p)}
#nbar .nlbl{flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acc2);background:var(--p2);border-right:1px solid var(--line);white-space:nowrap}
#nbar .nlbl b{color:var(--bad);letter-spacing:0;font-size:12px}
.nvp{flex:1;min-width:0;overflow:hidden;position:relative}
.ntrack{display:flex;width:max-content;height:100%;animation:nscroll var(--dur,150s) linear infinite}
#nbar.paused .ntrack{animation-play-state:paused}
@keyframes nscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ni{display:flex;align-items:center;gap:7px;height:100%;padding:0 22px 0 0;margin:0;background:none;border:0;color:var(--fg);font-size:15px;white-space:nowrap;cursor:pointer}
.ni .ns{font-size:10.5px;letter-spacing:1px;color:var(--acc);text-transform:uppercase}
.ni.red{color:#ff7a7a;font-weight:700}.ni.red .ns{color:#fca5a5}
.ni svg.warn{width:16px;height:16px;flex:none;fill:#dc2626;stroke:#fff;stroke-width:1.6}
header{flex:none;display:flex;align-items:center;gap:16px;padding:8px 16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(90deg,rgba(180,124,255,.2),var(--p) 45%)}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:.5px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.brand small{display:block;font-size:11px;font-weight:600;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase}
.clock{margin-left:auto;display:flex;align-items:center;gap:10px}
#time{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
#date{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;line-height:1.3}
#wx{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--line)}
#wx .t{font-size:34px;font-weight:700}
#wx .c{font-size:13px;color:var(--mut);line-height:1.35}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.card{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--p);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.7}
.ch{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--acc2);border-bottom:1px solid var(--line);white-space:nowrap}
.ch .src{margin-left:auto;color:#6f6589;letter-spacing:.5px;text-transform:none;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.cb{flex:1;min-height:0;padding:12px 14px}
.drive{flex:1}.car{flex:1}
.big{display:flex;align-items:baseline;gap:10px}
.big b{font-size:56px;line-height:1;font-weight:800;color:#fff}
.big span{font-size:20px;color:var(--mut)}
.sub{margin-top:6px;font-size:15px;color:#cfc6e3;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:#16072b;font-weight:800;font-size:17px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc2)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.muted{color:var(--mut);font-size:14px}
.carrow{display:flex;align-items:center;gap:14px}
.batt{flex:1;height:14px;border-radius:7px;background:#221a36;overflow:hidden}
.batt i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.kv small{display:block;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.kv span{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mv{display:flex;flex-direction:column;gap:8px;padding:8px 10px}
.mvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.mvtabs button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--p2);color:var(--mut);font-weight:700;font-size:14px;cursor:pointer}
.mvtabs button.on{color:#16072b;background:var(--acc);border-color:var(--acc)}
.mvlist{flex:1;min-height:0;display:grid;grid-template-rows:repeat(10,minmax(0,1fr));overflow-y:auto}
.mvr{display:grid;grid-template-columns:62px minmax(0,1fr) auto 80px;align-items:center;gap:8px;padding:0 4px;min-height:24px;border-bottom:1px solid rgba(43,32,69,.7);text-decoration:none;color:var(--fg);font-size:14px}
.mvr:last-child{border-bottom:0}
.mvr .nm{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvr .px,.mvr .pc{text-align:right;font-variant-numeric:tabular-nums}
.mvr .pc{font-weight:700;border-radius:6px;padding:2px 6px;font-size:13px}
.up{color:var(--good);background:rgba(61,220,151,.12)}.dn{color:var(--bad);background:rgba(255,107,107,.12)}
.mvmsg{color:var(--mut);font-size:14px;padding:10px 4px;grid-row:1/-1}
#rdr{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:rgba(4,2,9,.82);display:flex;align-items:center;justify-content:center;padding:12px}
#rdr[hidden]{display:none}
.rbox{width:760px;max-width:100%;max-height:calc(100vh - 24px);overflow:auto;background:var(--p);border:1px solid var(--acc);border-radius:16px;padding:16px 18px 18px}
.rbox.red{border-color:#dc2626}
.rtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rsrc{flex:1;min-width:0;font-size:13px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.rclose{flex:none;display:flex;align-items:center;gap:8px;height:54px;padding:0 22px;border-radius:12px;background:var(--p2);border:1px solid var(--line);color:var(--fg);font-size:18px;font-weight:700;cursor:pointer}
.rflag{display:none;align-items:center;gap:6px;color:#fecaca;background:#7f1d1d;border:1px solid #dc2626;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.rbox.red .rflag{display:inline-flex}
.rbox h2{margin:0 0 8px;font-size:26px;line-height:1.2}.rbox.red h2{color:#ff7a7a}
.rbox img{display:block;width:100%;max-height:40vh;object-fit:cover;border-radius:10px;margin:4px 0 10px}
.rbox p{font-size:17px;line-height:1.5;color:#ddd5ee;margin:0 0 14px}
#pairbox{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:#140f22;border:1px solid var(--acc);border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.6);width:420px;max-width:92vw}
#pairbox[hidden]{display:none}
#pairbox .pt{display:flex;align-items:center;font-size:17px;font-weight:700;margin-bottom:8px}
#pairbox .px{margin-left:auto;background:none;border:0;color:var(--mut);font-size:30px;line-height:1;cursor:pointer;padding:0 8px}
#pairbox form{display:flex;gap:8px}
#paircode{flex:1;min-width:0;font:700 34px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:8px;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:#0b0814;color:var(--fg)}
#pairmsg{min-height:18px;margin-top:8px;font-size:14px;color:var(--mut)}
#pairmsg.bad{color:#f87171}#pairmsg.ok{color:#4ade80}
@media (max-width:820px){main{grid-template-columns:1fr}.app{height:auto}#wx .c{display:none}.mvlist{min-height:300px}}
@media (max-height:700px){#time{font-size:34px}.big b{font-size:46px}header{padding:6px 14px}.cb{padding:10px 12px}}
</style>
</head>
<body>
<div class="app">
  <div id="nbar"><span class="nlbl"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7 9h7M7 13h7M7 16h4"/></svg>News <b id="nred"></b></span><div class="nvp"><div class="ntrack" id="ntrack"><span class="ni"><span class="ns">news</span>Loading headlines…</span></div></div></div>
  <header>
    <div class="brand"><i></i><div>Anna<small>Caroline's whip</small></div></div>
    <div class="clock"><div id="time">--:--</div><div id="date"></div></div>
    <div id="wx"><div class="t">--°</div><div class="c">Tarpon Springs</div></div>
  </header>
  <main>
    <div class="col">
      <section class="card drive"><div class="ch">Drive home<span class="src" id="etasrc">1474 Lakeview Dr</span></div>
        <div class="cb" id="eta"><div class="muted">Loading…</div></div></section>
      <section class="card car"><div class="ch">My car<span class="src" id="carsrc">Caroline's whip</span></div>
        <div class="cb" id="car"><div class="muted">Loading…</div></div></section>
    </div>
    <section class="card"><div class="ch">Stocks · top movers<span class="src" id="mvsrc">Yahoo Finance</span></div>
      <div class="cb mv"><div class="mvtabs" id="mvtabs"><button type="button" data-k="gainers" class="on">Gainers</button><button type="button" data-k="active">Active</button><button type="button" data-k="losers">Losers</button></div>
      <div class="mvlist" id="mvlist"><div class="mvmsg">Loading…</div></div></div></section>
  </main>
</div>

<div id="rdr" hidden><div class="rbox" id="rbox">
  <div class="rtop"><span class="rsrc" id="rsrc"></span><button class="rclose" id="rclose" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Close</button></div>
  <span class="rflag"><span id="rwhy"></span></span>
  <h2 id="rh"></h2><img id="rimg" alt="" hidden><p id="rdesc"></p>
  <a class="btn" id="ropen" href="#" target="_blank" rel="noopener">Open full article</a>
</div></div>

<div id="pairbox" hidden>
  <div class="pt">Pair this screen<button class="px" type="button" aria-label="Close" id="pairx">×</button></div>
  <form id="pairform" autocomplete="off">
    <input id="paircode" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" aria-label="6-digit pairing code">
    <button class="btn" type="submit" id="pairgo">Pair</button>
  </form>
  <div id="pairmsg">Enter the 6-digit code (valid 10 min, works once).</div>
</div>
<script src="core.js"></script><script src="news.js"></script><script src="movers.js"></script><script src="car.js"></script><script src="app.js"></script>
</body>
</html>
